[package]
name = "persistent-task"
version = "0.1.0"
description = "桌面端任务管理：每日任务、番茄时钟、标签树、统计面板"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "persistent_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "persistent-task"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
parking_lot = "0.12"

# MCP server stack — 仅在 `--mcp` 子命令模式下使用
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
schemars = "1"
dirs = "5"
base64 = "0.22"

# AI 快速录入：直调 Anthropic Messages API（Key 不出前端，避开浏览器 CORS）
# rustls-tls 避免对系统 OpenSSL 的依赖；只要 json 解析能力。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
